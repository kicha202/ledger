<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>நிதி பதிவேடு · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="../app.css">
<style>
  #loginScreen{max-width:360px;width:calc(100% - 24px);margin:60px auto;}
  .hidden{display:none;}
  .login-error{color:var(--red);font-size:13px;margin-top:8px;}
  .admin-tag{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:8px;vertical-align:middle;}
</style>
</head>
<body>

<div id="loginScreen" class="card hidden">
  <h2>Super Admin</h2>
  <div class="field">
    <label id="pwLabel">Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
  </div>
  <button class="btn" id="loginBtn">Log in</button>
  <div class="login-error" id="loginError"></div>
</div>

<div id="appRoot" class="hidden">
  <header>
    <div class="headrow">
      <div class="seal">நி</div>
      <h1 id="appTitle">நிதி பதிவேடு<small id="appSub">NIDHI LEDGER · ADMIN</small></h1>
      <button class="lang-toggle" onclick="toggleLang()" id="langBtn">English</button>
      <button class="lang-toggle" id="logoutBtn" style="margin-left:8px;">Log out</button>
    </div>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
  <div id="confirmModalHost"></div>
</div>

<script>
  window.NIDHI_API_BASE = 'https://nidhi-ledger-api.hexstudio.workers.dev';
  // Admin surface: the same app as the public page, with every CRUD control enabled.
  window.NIDHI_READ_ONLY = false;
</script>
<script src="../app.js"></script>
<script>
const loginScreen = document.getElementById('loginScreen');
const appRoot = document.getElementById('appRoot');
let appStarted = false;

function showLogin(){
  appRoot.classList.add('hidden');
  loginScreen.classList.remove('hidden');
}
function showApp(){
  loginScreen.classList.add('hidden');
  appRoot.classList.remove('hidden');
  if(!appStarted){ appStarted = true; startNidhiApp(); }
}
// app.js calls this if any request comes back 401 (e.g. the session expired mid-edit).
window.onNidhiUnauthorized = function(){
  appStarted = false;
  showLogin();
  document.getElementById('loginError').textContent = 'Session expired. Please log in again.';
};

async function doLogin(){
  const passwordEl = document.getElementById('loginPassword');
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    const res = await fetch(window.NIDHI_API_BASE + '/api/admin/login', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json','X-Admin-Request':'1'},
      body: JSON.stringify({ password: passwordEl.value })
    });
    const body = await res.json().catch(()=>({}));
    if(!res.ok){ errEl.textContent = body.error || 'Login failed'; return; }
    passwordEl.value = '';
    showApp();
  }catch(e){
    errEl.textContent = 'Could not reach the server. Please try again.';
  }
}

async function doLogout(){
  try{
    await fetch(window.NIDHI_API_BASE + '/api/admin/logout', {
      method:'POST', credentials:'include', headers:{'X-Admin-Request':'1'}
    });
  }catch(e){ /* logging out locally regardless */ }
  location.reload();
}

async function checkSession(){
  try{
    const res = await fetch(window.NIDHI_API_BASE + '/api/admin/session', { credentials:'include' });
    const body = await res.json();
    if(body.authenticated) showApp(); else showLogin();
  }catch(e){ showLogin(); }
}

document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('loginPassword').addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});

checkSession();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nidhi Ledger · Super Admin</title>
<style>
  :root{ --paper:#F7F1E4; --paper-line:#E3D6BC; --ink:#2B2118; --ink-soft:#5B4F41;
    --maroon:#7A1E3A; --maroon-dark:#5A1329; --gold:#A9791F; --green:#2F6B4F; --red:#A33B2B; --card:#FFFDF8; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;min-height:100vh;}
  header{background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));color:#F7F1E4;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:18px;margin:0;}
  .btn{background:var(--maroon);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--maroon-dark);}
  .btn.secondary{background:#fff;color:var(--maroon);border:1.5px solid var(--maroon);}
  .btn.danger{background:var(--red);}
  .btn.small{padding:5px 10px;font-size:12px;}
  main{max-width:1000px;margin:0 auto;padding:20px 14px 60px;}
  .card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:16px;margin:0 0 12px;color:var(--maroon);border-bottom:2px solid var(--paper-line);padding-bottom:8px;}
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:14px;background:#fff;color:var(--ink);}
  .field{margin-bottom:10px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--paper-line);}
  th{color:var(--ink-soft);font-size:11px;text-transform:uppercase;}
  nav{display:flex;gap:2px;background:var(--maroon-dark);padding:0 8px;overflow-x:auto;}
  nav button{background:none;border:none;color:#EEDFC3;padding:12px 14px;font-size:13px;font-weight:600;cursor:pointer;opacity:.75;border-bottom:3px solid transparent;}
  nav button.active{opacity:1;border-bottom-color:var(--gold);color:#fff;}
  .error{color:var(--red);font-size:13px;margin-top:8px;}
  .row-actions{display:flex;gap:6px;}
  #loginScreen{max-width:360px;margin:80px auto;}
  .hidden{display:none;}
</style>
</head>
<body>

<div id="loginScreen" class="card hidden">
  <h2>Super Admin Login</h2>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
  </div>
  <button class="btn" onclick="doLogin()">Log in</button>
  <div class="error" id="loginError"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Nidhi Ledger · Super Admin</h1>
    <button class="btn secondary" onclick="doLogout()">Log out</button>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>

<script>
const API_BASE = window.NIDHI_API_BASE || '';
let TAB = 'settings';
let DATA = { members:[], subs:[], loans:[], payments:{}, transactions:[], cycles:[], settings:{} };

async function api(method, path, body){
  const opts = { method, credentials:'include', headers:{'Content-Type':'application/json'} };
  if(['POST','PUT','DELETE'].includes(method)) opts.headers['X-Admin-Request'] = '1';
  if(body != null) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  if(res.status === 401){ showLogin(); throw new Error('unauthenticated'); }
  if(!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error || (method+' '+path+' failed')); }
  return res.status === 204 ? null : res.json();
}

function showLogin(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}
function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderTabs(); loadAll();
}

async function doLogin(){
  const password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  try{
    await api('POST', '/api/admin/login', { password });
    document.getElementById('loginPassword').value = '';
    showApp();
  }catch(e){ document.getElementById('loginError').textContent = e.message; }
}
async function doLogout(){ await api('POST', '/api/admin/logout'); showLogin(); }

async function checkSession(){
  try{
    const res = await fetch(API_BASE + '/api/admin/session', { credentials:'include' });
    const j = await res.json();
    if(j.authenticated) showApp(); else showLogin();
  }catch(e){ showLogin(); }
}

function renderTabs(){
  const tabs = [['settings','Settings'],['members','Members'],['subs','Subscriptions'],['loans','Loans'],['transactions','Transactions'],['cycles','Cycles']];
  document.getElementById('tabs').innerHTML = tabs.map(([id,label]) =>
    `<button class="${TAB===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('');
}
function setTab(id){ TAB = id; renderTabs(); render(); }

async function loadAll(){
  const [members, subs, loans, transactions, cycles, settings] = await Promise.all([
    api('GET','/api/members'), api('GET','/api/subs'), api('GET','/api/loans'),
    api('GET','/api/transactions'), api('GET','/api/cycles'), api('GET','/api/settings')
  ]);
  DATA = { members, subs, loans, transactions, cycles, settings };
  render();
}

function fmt(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function memberName(id){ const m = DATA.members.find(x=>x.id===id); return m ? m.name : id; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function render(){
  const main = document.getElementById('main');
  if(TAB==='settings') main.innerHTML = renderSettings();
  else if(TAB==='members') main.innerHTML = renderMembers();
  else if(TAB==='subs') main.innerHTML = renderSubs();
  else if(TAB==='loans') main.innerHTML = renderLoans();
  else if(TAB==='transactions') main.innerHTML = renderTxns();
  else if(TAB==='cycles') main.innerHTML = renderCycles();
}

/* ---------- Settings ---------- */
function renderSettings(){
  const s = DATA.settings;
  return `<div class="card"><h2>App Settings</h2>
    <div class="grid">
      <div class="field"><label>Organization Name</label><input id="s_org" value="${s.orgName||''}"></div>
      <div class="field"><label>Standard Monthly Subscription (₹)</label><input id="s_sub" type="number" value="${s.subAmount||500}"></div>
      <div class="field"><label>Group Start Month</label><input id="s_start" type="month" value="${s.startMonth||''}"></div>
    </div>
    <button class="btn" onclick="saveSettings()">Save Settings</button></div>`;
}
async function saveSettings(){
  const body = {
    orgName: document.getElementById('s_org').value,
    subAmount: Number(document.getElementById('s_sub').value)||500,
    startMonth: document.getElementById('s_start').value,
    startMonthAuto: false,
  };
  await api('PUT','/api/settings', body);
  DATA.settings = body;
  alert('Settings saved.');
}

/* ---------- Members ---------- */
function renderMembers(){
  const rows = DATA.members.map(m => `<tr>
    <td>${m.name}</td><td>${m.phone||'—'}</td><td>${m.joinDate||'—'}</td><td>${m.exited?'Exited':'Active'}</td>
    <td class="row-actions">
      <button class="btn small danger" onclick="deleteMember('${m.id}')">Delete</button>
    </td></tr>`).join('') || '<tr><td colspan="5">No members yet</td></tr>';
  return `<div class="card"><h2>Add Member</h2>
    <div class="grid">
      <div class="field"><label>Name</label><input id="m_name"></div>
      <div class="field"><label>Phone</label><input id="m_phone"></div>
      <div class="field"><label>Join Date</label><input id="m_join" type="date"></div>
      <div class="field"><label>Nominee</label><input id="m_nominee"></div>
      <div class="field"><label>Registration Fee (₹)</label><input id="m_fee" type="number" value="0"></div>
    </div>
    <button class="btn" onclick="addMember()">Add Member</button></div>
    <div class="card"><h2>Members</h2><table><tr><th>Name</th><th>Phone</th><th>Joined</th><th>Status</th><th></th></tr>${rows}</table></div>`;
}
async function addMember(){
  const name = document.getElementById('m_name').value.trim();
  if(!name) return alert('Name required');
  const body = { id: uid(), name, phone: document.getElementById('m_phone').value,
    joinDate: document.getElementById('m_join').value, nominee: document.getElementById('m_nominee').value,
    regFee: Number(document.getElementById('m_fee').value)||0, exited:false };
  await api('POST','/api/members', body);
  await loadAll(); setTab('members');
}
async function deleteMember(id){
  if(!confirm('Delete this member? Their subscription/loan records remain.')) return;
  await api('DELETE', '/api/members/'+id);
  await loadAll(); setTab('members');
}

/* ---------- Subscriptions ---------- */
function renderSubs(){
  const options = DATA.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  const rows = DATA.subs.slice().reverse().map(s => `<tr>
    <td>${memberName(s.memberId)}</td><td>${s.month}</td><td>${fmt(s.amount)}</td><td>${s.date||'—'}</td>
    <td><button class="btn small danger" onclick="deleteSub('${s.id}')">Delete</button></td></tr>`).join('')
    || '<tr><td colspan="5">No records yet</td></tr>';
  return `<div class="card"><h2>Record Subscription Payment</h2>
    <div class="grid">
      <div class="field"><label>Member</label><select id="sub_member">${options}</select></div>
      <div class="field"><label>Month</label><input id="sub_month" type="month"></div>
      <div class="field"><label>Amount (₹)</label><input id="sub_amount" type="number" value="${DATA.settings.subAmount||500}"></div>
      <div class="field"><label>Date</label><input id="sub_date" type="date"></div>
    </div>
    <button class="btn" onclick="addSub()">Record</button></div>
    <div class="card"><h2>Subscription History</h2><table><tr><th>Member</th><th>Month</th><th>Amount</th><th>Date</th><th></th></tr>${rows}</table></div>`;
}
async function addSub(){
  const memberId = document.getElementById('sub_member').value;
  if(!memberId) return alert('No members yet');
  const body = { id: uid(), memberId, month: document.getElementById('sub_month').value,
    amount: Number(document.getElementById('sub_amount').value)||0, date: document.getElementById('sub_date').value };
  await api('POST','/api/subs', body);
  await loadAll(); setTab('subs');
}
async function deleteSub(id){ await api('DELETE','/api/subs/'+id); await loadAll(); setTab('subs'); }

/* ---------- Loans ---------- */
function renderLoans(){
  const options = DATA.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  const rows = DATA.loans.map(l => `<tr>
    <td>${memberName(l.memberId)}</td><td>${fmt(l.amount)}</td><td>${l.rate}%</td><td>${l.installments}</td><td>${l.issueDate||'—'}</td>
    <td><button class="btn small danger" onclick="deleteLoan('${l.id}')">Delete</button></td></tr>`).join('')
    || '<tr><td colspan="6">No loans yet</td></tr>';
  return `<div class="card"><h2>Issue Loan</h2>
    <div class="grid">
      <div class="field"><label>Member</label><select id="l_member">${options}</select></div>
      <div class="field"><label>Amount (₹)</label><input id="l_amount" type="number"></div>
      <div class="field"><label>Monthly Interest Rate (%)</label><input id="l_rate" type="number" value="2"></div>
      <div class="field"><label>Installments</label><input id="l_inst" type="number" value="10"></div>
      <div class="field"><label>Issue Date</label><input id="l_date" type="date"></div>
    </div>
    <button class="btn" onclick="addLoan()">Issue Loan</button></div>
    <div class="card"><h2>Loans</h2><table><tr><th>Member</th><th>Amount</th><th>Rate</th><th>Installments</th><th>Issued</th><th></th></tr>${rows}</table></div>`;
}
async function addLoan(){
  const memberId = document.getElementById('l_member').value;
  if(!memberId) return alert('No members yet');
  const body = { id: uid(), memberId, amount: Number(document.getElementById('l_amount').value)||0,
    rate: Number(document.getElementById('l_rate').value)||0, installments: Number(document.getElementById('l_inst').value)||1,
    issueDate: document.getElementById('l_date').value };
  await api('POST','/api/loans', body);
  await loadAll(); setTab('loans');
}
async function deleteLoan(id){
  if(!confirm('Delete this loan and its installment records?')) return;
  await api('DELETE','/api/loans/'+id);
  await loadAll(); setTab('loans');
}

/* ---------- Transactions ---------- */
function renderTxns(){
  const rows = DATA.transactions.slice().reverse().map(x => `<tr>
    <td>${x.type}</td><td>${fmt(x.amount)}</td><td>${x.category||'—'}</td><td>${x.date||'—'}</td><td>${x.auto?'Auto':'Manual'}</td>
    <td>${x.auto?'':`<button class="btn small danger" onclick="deleteTxn('${x.id}')">Delete</button>`}</td></tr>`).join('')
    || '<tr><td colspan="6">No transactions yet</td></tr>';
  return `<div class="card"><h2>Add Ledger Entry</h2>
    <div class="grid">
      <div class="field"><label>Type</label><select id="t_type"><option value="income">Income</option><option value="expense">Expense</option></select></div>
      <div class="field"><label>Amount (₹)</label><input id="t_amount" type="number"></div>
      <div class="field"><label>Category</label><input id="t_cat"></div>
      <div class="field"><label>Date</label><input id="t_date" type="date"></div>
      <div class="field"><label>Note</label><input id="t_note"></div>
    </div>
    <button class="btn" onclick="addTxn()">Add Entry</button></div>
    <div class="card"><h2>Transaction History</h2><table><tr><th>Type</th><th>Amount</th><th>Category</th><th>Date</th><th>Source</th><th></th></tr>${rows}</table></div>`;
}
async function addTxn(){
  const body = { id: uid(), type: document.getElementById('t_type').value,
    amount: Number(document.getElementById('t_amount').value)||0, category: document.getElementById('t_cat').value,
    date: document.getElementById('t_date').value, note: document.getElementById('t_note').value, auto:false };
  await api('POST','/api/transactions', body);
  await loadAll(); setTab('transactions');
}
async function deleteTxn(id){ await api('DELETE','/api/transactions/'+id); await loadAll(); setTab('transactions'); }

/* ---------- Cycles (read-only history) ---------- */
function renderCycles(){
  const rows = DATA.cycles.map(cy => `<tr><td>#${cy.number}</td><td>${cy.resetDate}</td><td>${fmt(cy.interestDistributed)}</td>
    <td>${fmt(cy.perMemberShare)}</td><td>${cy.memberCount}</td></tr>`).join('') || '<tr><td colspan="5">No cycles closed yet</td></tr>';
  return `<div class="card"><h2>Interest Distribution Cycles</h2>
    <table><tr><th>Cycle</th><th>Closed</th><th>Interest Distributed</th><th>Per Member</th><th>Members</th></tr>${rows}</table></div>`;
}

checkSession();
</script>
</body>
</html>

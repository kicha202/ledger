<style>
  :root{

    --maroon-dark:#5A1329;
    --gold:#A9791F;
    --green:#2F6B4F;
    --red:#A33B2B;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image: repeating-linear-gradient(var(--paper) 0 34px, var(--paper-line) 34px 35px);
    color:var(--ink);
    font-family:'Inter','Noto Sans Tamil',sans-serif;
    min-height:100vh;
  }
  .lang-ta{font-family:'Noto Sans Tamil','Inter',sans-serif;}
  header{
    background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    color:#F7F1E4;
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px;height:160px;border-radius:50%;
    border:2px dashed rgba(247,241,228,0.25);
  }
  .seal{
    width:54px;height:54px;border-radius:50%;
    border:2.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif Tamil',serif; font-weight:700; font-size:20px;
    color:var(--gold); flex-shrink:0;
    background:rgba(0,0,0,0.15);
  }
  .headrow{display:flex; align-items:center; gap:14px; position:relative; z-index:1;}
  h1{
    font-family:'Noto Serif Tamil',serif;
    font-size:22px; margin:0; line-height:1.25;
  }
  h1 small{display:block; font-family:'Playfair Display',serif; font-size:13px; font-weight:600; letter-spacing:1.5px; opacity:0.85; margin-top:2px;}
  .lang-toggle{
    margin-left:auto; background:rgba(255,255,255,0.12); border:1px solid rgba(247,241,228,0.4);
    color:#F7F1E4; padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer; font-weight:600;
  }
  nav{
    display:flex; overflow-x:auto; gap:2px; background:var(--maroon-dark); padding:0 8px;
  }
  nav button{
    background:none;border:none;color:#EEDFC3;padding:12px 14px;font-size:13.5px;font-weight:600;
    cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; opacity:0.75;
  }
  nav button.active{opacity:1; border-bottom-color:var(--gold); color:#fff;}
  main{max-width:920px;margin:0 auto;padding:18px 14px 60px;}
  .card{
    background:var(--card); border:1px solid var(--paper-line); border-radius:10px;
    padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(43,33,24,0.06);
  }
  .card h2{
    font-family:'Noto Serif Tamil',serif; font-size:17px; margin:0 0 12px;
    color:var(--maroon); border-bottom:2px solid var(--paper-line); padding-bottom:8px;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}
  label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
  input, select{
    width:100%; padding:9px 10px; border:1px solid var(--paper-line); border-radius:6px;
    font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field{margin-bottom:10px;}
  .btn{
    background:var(--maroon); color:#fff; border:none; padding:10px 18px; border-radius:6px;
    font-size:14px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .btn:hover{background:var(--maroon-dark);}
  .btn.secondary{background:#fff; color:var(--maroon); border:1.5px solid var(--maroon);}
  .btn.small{padding:5px 10px; font-size:12px; margin:0;}
  .btn.gold{background:var(--gold);}
  .row-actions{display:flex; gap:6px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:8px 8px; text-align:left; border-bottom:1px solid var(--paper-line);}
  th{color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px;}
  tr:last-child td{border-bottom:none;}
  .tag{padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700;}
  .tag.paid{background:#E4F1E9; color:var(--green);}
  .tag.due{background:#FBE6E1; color:var(--red);}
  .empty{color:var(--ink-soft); font-size:13px; padding:14px 0; text-align:center;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (min-width:560px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--card); border:1px solid var(--paper-line); border-radius:10px; padding:14px; text-align:center;}
  .stat .num{font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--maroon);}
  .stat .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .muted{color:var(--ink-soft); font-size:12.5px;}
  .divider{height:1px; background:var(--paper-line); margin:14px 0;}
  .schedule-mini{font-size:12px;}
  .table-wrap{overflow-x:auto;}
  select.member-select{max-width:100%;}
  .export-row{display:flex; gap:10px; flex-wrap:wrap;}
  .badge-installments{font-size:11px; background:#EEE3CC; color:var(--gold); padding:2px 8px; border-radius:10px; font-weight:700;}
</style>

/* ---------------- loan schedule logic ---------------- */
// Decreasing interest method: for N installments, interest factor for
// installment i (1-indexed) = 100 - floor((i-1) * 100/N), e.g. N=10 -> 100,90,...,10
function buildSchedule(loan){
  const N = loan.installments;
  const principalPart = loan.amount / N;
  const schedule = [];
  for(let i=1;i<=N;i++){
    const factor = Math.round((100 - (i-1)*(100/N)) * 100)/100;
    const interestPart = Math.round(loan.amount * (factor/100) * (loan.rate/100) * 100)/100;
    const total = Math.round((principalPart + interestPart)*100)/100;
    schedule.push({no:i, factor, principalPart: Math.round(principalPart*100)/100, interestPart, total});
  }
  return schedule;
}
function loanPayments(loanId){ return state.transactionsLoanPayments ? [] : (state.loanPayments||[]).filter(p=>p.loanId===loanId); }

/* ensure loanPayments array exists */
if(!state.loanPayments) state.loanPayments = [];

function isInstallmentPaid(loanId, no){
  return (state.loanPayments||[]).some(p=>p.loanId===loanId && p.no===no);
}
function loanOutstanding(loan){
  const sched = buildSchedule(loan);
  const paidNos = new Set((state.loanPayments||[]).filter(p=>p.loanId===loan.id).map(p=>p.no));
  const remaining = sched.filter(r=>!paidNos.has(r.no)).reduce((s,r)=>s+r.total,0);
  return Math.round(remaining*100)/100;
}
function remainingInstallments(loan){
  const paidCount = (state.loanPayments||[]).filter(p=>p.loanId===loan.id).length;
  return Math.max(loan.installments - paidCount, 0);
}
function nextDueInstallment(loan){
  const sched = buildSchedule(loan);
  const paidNos = new Set((state.loanPayments||[]).filter(p=>p.loanId===loan.id).map(p=>p.no));
  return sched.find(r=>!paidNos.has(r.no)) || null;
}

function downloadCanvasPDF(canvas, filename){
  const { jsPDF } = window.jspdf;
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const pageW = 210, pageH = 297, margin = 10;
  const imgW = pageW - margin*2;
  const imgH = canvas.height * imgW / canvas.width;
  const usableH = pageH - margin*2;
  const doc = new jsPDF('p','mm','a4');
  let heightLeft = imgH;
  let position = 0;
  doc.addImage(imgData, 'JPEG', margin, position+margin, imgW, imgH);
  heightLeft -= usableH;
  while(heightLeft > 0){
    position -= usableH;
    doc.addPage();
    doc.addImage(imgData, 'JPEG', margin, position+margin, imgW, imgH);
    heightLeft -= usableH;
  }
  doc.save(filename + '.pdf');
}

function lastCycleResetDate(){
  if(!state.cycles || !state.cycles.length) return null;
  return state.cycles[state.cycles.length-1].resetDate;
}
function totalInterestCollected(){
  const since = lastCycleResetDate();
  let total = 0;
  (state.loanPayments||[]).forEach(p=>{
    if(p.interestWaived) return;
    if(since && p.date && p.date <= since) return;
    const loan = state.loans.find(l=>l.id===p.loanId);
    if(!loan) return;
    const row = buildSchedule(loan).find(r=>r.no===p.no);
    if(!row || !row.total) return;
    total += Number(p.amount) * (row.interestPart / row.total);
  });
  return Math.round(total*100)/100;
}
function totalRegFeeCollected(){
  return state.members.reduce((s,m)=>s+Number(m.regFee||0),0);
}
function monthlyLoanBreakdown(){
  const map = {};
  const ensure = (month) => { if(!month) return null; if(!map[month]) map[month] = {subs:0, loanIssued:0, principalCollected:0, interestCollected:0}; return map[month]; };

  state.subs.forEach(s=>{ const row = ensure((s.date||s.month||'').slice(0,7)); if(row) row.subs += Number(s.amount); });

  state.loans.forEach(l=>{ const row = ensure((l.issueDate||'').slice(0,7)); if(row) row.loanIssued += Number(l.amount); });

  (state.loanPayments||[]).forEach(p=>{
    const loan = state.loans.find(l=>l.id===p.loanId);
    if(!loan) return;
    const sched = buildSchedule(loan).find(r=>r.no===p.no);
    if(!sched || !sched.total) return;
    const row = ensure((p.date||'').slice(0,7));
    if(!row) return;
    if(p.interestWaived){
      row.principalCollected += Number(p.amount);
    } else {
      row.principalCollected += Number(p.amount) * (sched.principalPart / sched.total);
      row.interestCollected += Number(p.amount) * (sched.interestPart / sched.total);
    }
  });

  return Object.entries(map)
    .map(([month,v])=>[month, {subs:Math.round(v.subs*100)/100, loanIssued:Math.round(v.loanIssued*100)/100, principalCollected:Math.round(v.principalCollected*100)/100, interestCollected:Math.round(v.interestCollected*100)/100}])
    .sort((a,b)=>b[0].localeCompare(a[0]));
}

function balanceAsOfMonthStart(cutoffMonth){
  const subsTotal = state.subs.filter(s=>(s.date||s.month||'') < cutoffMonth).reduce((s,x)=>s+Number(x.amount),0);
  const txnIncome = state.transactions.filter(x=>x.type==='income' && (x.date||'') < cutoffMonth).reduce((s,x)=>s+Number(x.amount),0);
  const txnExpense = state.transactions.filter(x=>x.type==='expense' && (x.date||'') < cutoffMonth).reduce((s,x)=>s+Number(x.amount),0);
  return Math.round((subsTotal + txnIncome - txnExpense)*100)/100;
}
function balanceBreakdown(){
  const subsTotal = state.subs.reduce((s,x)=>s+Number(x.amount),0);
  const loanRepayCollected = state.transactions.filter(x=>x.sourceType==='loan_payment').reduce((s,x)=>s+Number(x.amount),0);
  const memberFees = state.transactions.filter(x=>x.sourceType==='member_fee').reduce((s,x)=>s+Number(x.amount),0);
  const catchupIncome = state.transactions.filter(x=>x.sourceType==='interest_buyin').reduce((s,x)=>s+Number(x.amount),0);
  const otherIncome = state.transactions.filter(x=>x.type==='income' && !x.auto).reduce((s,x)=>s+Number(x.amount),0);
  const loanDisbursed = state.transactions.filter(x=>x.sourceType==='loan').reduce((s,x)=>s+Number(x.amount),0);
  const exitSettlements = state.transactions.filter(x=>x.sourceType==='member_exit').reduce((s,x)=>s+Number(x.amount),0);
  const otherExpense = state.transactions.filter(x=>x.type==='expense' && !x.auto).reduce((s,x)=>s+Number(x.amount),0);
  const totalIncome = subsTotal + loanRepayCollected + memberFees + catchupIncome + otherIncome;
  const totalExpense = loanDisbursed + exitSettlements + otherExpense;
  return { subsTotal, loanRepayCollected, memberFees, catchupIncome, otherIncome, loanDisbursed, exitSettlements, otherExpense, totalIncome, totalExpense, net: totalIncome - totalExpense };
}

function groupStartMonth(){
  const months = [];
  state.members.forEach(m=>{ if(m.joinDate) months.push(m.joinDate.slice(0,7)); });
  state.subs.forEach(s=>{ if(s.month) months.push(s.month); });
  state.loans.forEach(l=>{ if(l.issueDate) months.push(l.issueDate.slice(0,7)); });
  if(!months.length) return null;
  return months.reduce((a,b)=> a<b?a:b);
}
function ensureAutoStartMonth(){
  if(!state.settings) state.settings = {};
  if(state.settings.startMonthAuto === false) return; // user manually fixed this — don't override
  const detected = groupStartMonth() || new Date().toISOString().slice(0,7);
  if(!state.settings.startMonth || detected < state.settings.startMonth){
    state.settings.startMonth = detected;
    state.settings.startMonthAuto = true;
    saveState();
  }
}
function currentMonthNumber(){
  const start = (state.settings && state.settings.startMonth) || groupStartMonth();
  if(!start) return 0;
  const currentMonth = new Date().toISOString().slice(0,7);
  const [sy,sm] = start.split('-').map(Number);
  const [ey,em] = currentMonth.split('-').map(Number);
  return Math.max((ey-sy)*12 + (em-sm) + 1, 1);
}

function computeMemberStatement(memberId){
  const member = state.members.find(m=>m.id===memberId);
  if(!member) return null;
  const subHistory = state.subs.filter(s=>s.memberId===memberId).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const memberLoans = state.loans.filter(l=>l.memberId===memberId).slice().sort((a,b)=>(a.issueDate||'').localeCompare(b.issueDate||''));
  const memberLoanIds = new Set(memberLoans.map(l=>l.id));
  const loanPaymentHistory = (state.loanPayments||[]).filter(p=>memberLoanIds.has(p.loanId)).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const subTotal = subHistory.reduce((s,x)=>s+Number(x.amount),0);
  const loanTaken = memberLoans.reduce((s,l)=>s+Number(l.amount),0);
  const loanPaid = loanPaymentHistory.reduce((s,p)=>s+Number(p.amount),0);
  const loanOut = memberLoans.reduce((s,l)=>s+loanOutstanding(l),0);
  const paidMonthsList = subHistory.map(s=>s.month).filter(Boolean);
  const earliestPaidMonth = paidMonthsList.length ? paidMonthsList.reduce((a,b)=> a<b?a:b) : null;
  const joinMonth = (member.joinDate||'').slice(0,7) || null;
  const groupStart = (state.settings && state.settings.startMonth) || groupStartMonth();
  let baseMonth = joinMonth;
  if(earliestPaidMonth && (!baseMonth || earliestPaidMonth < baseMonth)) baseMonth = earliestPaidMonth;
  if(groupStart && (!baseMonth || groupStart < baseMonth)) baseMonth = groupStart;
  const currentMonth = new Date().toISOString().slice(0,7);
  let totalMonths = 0;
  if(baseMonth){
    const [sy,sm] = baseMonth.split('-').map(Number);
    const [ey,em] = currentMonth.split('-').map(Number);
    totalMonths = Math.max((ey-sy)*12 + (em-sm) + 1, 0);
  }
  const outstandingSubCount = Math.max(totalMonths - new Set(paidMonthsList).size, 0);

function calculateExitSettlement(){

  const subPaid = state.subs.filter(s=>s.memberId===memberId).reduce((s,x)=>s+Number(x.amount),0);
  const loanOut = state.loans.filter(l=>l.memberId===memberId).reduce((s,l)=>s+loanOutstanding(l),0);
  const totalInterest = totalInterestCollected();
  const activeCount = state.members.filter(m=>!m.exited).length || 1;
  const shareAmount = Math.round((totalInterest / activeCount)*100)/100;

  // subscription outstanding: months owed up to the exit month
  const paidMonthsList = state.subs.filter(s=>s.memberId===memberId).map(s=>s.month).filter(Boolean);
  const earliestPaidMonth = paidMonthsList.length ? paidMonthsList.reduce((a,b)=> a<b?a:b) : null;

  const outstandingMonths = Math.max(totalMonths - paidMonthsCount, 0);

function computeSettlementForMember(member, exitDate, sharedShareAmount){

  const loanOut = state.loans.filter(l=>l.memberId===member.id).reduce((s,l)=>s+loanOutstanding(l),0);
  const paidMonthsList = state.subs.filter(s=>s.memberId===member.id).map(s=>s.month).filter(Boolean);
  const earliestPaidMonth = paidMonthsList.length ? paidMonthsList.reduce((a,b)=> a<b?a:b) : null;
  const joinMonth = (member.joinDate||'').slice(0,7) || null;

  let baseMonth = joinMonth;
  if(earliestPaidMonth && (!baseMonth || earliestPaidMonth < baseMonth)) baseMonth = earliestPaidMonth;
  if(groupStart && (!baseMonth || groupStart < baseMonth)) baseMonth = groupStart;
  let totalMonths = 0;
  if(baseMonth){
    const [sy,sm] = baseMonth.split('-').map(Number);
    const [ey,em] = exitMonth.split('-').map(Number);
    totalMonths = Math.max((ey-sy)*12 + (em-sm) + 1, 0);
  }

function monthRange(startMonth, endMonth){
  const months = [];
  let [y,m] = startMonth.split('-').map(Number);
  const [ey,em] = endMonth.split('-').map(Number);
  let guard = 0;
  while((y<ey || (y===ey && m<=em)) && guard<600){
    months.push(`${y}-${String(m).padStart(2,'0')}`);
    m++; if(m>12){m=1;y++;}
    guard++;
  }
  return months;
}

      <td style="text-align:right;color:var(--maroon)">${fmt(historyTotals.total)}</td>
    </tr>` : '';


  // monthly collection sheet: A (subscription) + A1 (outstanding subscription) + B (installment principal) + C (interest) per member
  const collectionSheetRows = state.members.map((m,idx)=>{
    const loans = activeLoansForMember(m.id);
    const subA = m.exited ? 0 : standardSubAmount();
    let subA1 = 0;
    if(!m.exited){
      const paidMonthsList = state.subs.filter(s=>s.memberId===m.id).map(s=>s.month).filter(Boolean);
      const earliestPaidMonth = paidMonthsList.length ? paidMonthsList.reduce((a,b)=> a<b?a:b) : null;
      const joinMonth = (m.joinDate||'').slice(0,7) || null;
      const groupStart = (state.settings && state.settings.startMonth) || groupStartMonth();
      let baseMonth = joinMonth;
      if(earliestPaidMonth && (!baseMonth || earliestPaidMonth < baseMonth)) baseMonth = earliestPaidMonth;
      if(groupStart && (!baseMonth || groupStart < baseMonth)) baseMonth = groupStart;
      let totalMonths = 0;
      if(baseMonth){
        const [sy,sm] = baseMonth.split('-').map(Number);
        const [ey,em] = currentMonth.split('-').map(Number);
        totalMonths = Math.max((ey-sy)*12 + (em-sm) + 1, 0);
      }
      const paidMonthsCount = new Set(paidMonthsList).size;
      // exclude the current month's not-yet-paid amount from "outstanding" — that's what A already represents
      const paidThisMonth = state.subs.some(s=>s.memberId===m.id && s.month===currentMonth);
      const owedMonths = Math.max(totalMonths - paidMonthsCount - (paidThisMonth?0:1), 0);
      subA1 = owedMonths * standardSubAmount();
    }
    if(loans.length===0){
      return {no:idx+1, name:m.name, exited:!!m.exited, subA, subA1, loanReceived:0, progress:t('na'), instB:0, interestC:0, total:subA+subA1, hasLoan:false};
    }
    // use the first active loan for this member for the collection sheet
    const entry = loans[0];
    const loan = entry.loan, due = entry.due;
    const paidCount = (state.loanPayments||[]).filter(p=>p.loanId===loan.id).length;
    return {
      no:idx+1, name:m.name, exited:!!m.exited, subA, subA1, loanReceived:loan.amount,
      progress: `${due.no}/${loan.installments}`,
      instB: due.principalPart, interestC: due.interestPart,
      total: subA + subA1 + due.principalPart + due.interestPart, hasLoan:true
    };
  });
  const collectionSheetHtml = collectionSheetRows.map(r=>`
    <tr${r.exited?' style="opacity:0.6;"':''}>
      <td>${r.no}</td><td>${r.exited ? `<span style="text-decoration:line-through;">${r.name}</span> <span class="tag due" style="font-size:10px;">${t('exited_tag')}</span>` : r.name}</td>
      <td style="text-align:right">${r.exited ? t('na') : fmt(r.subA)}</td>
      <td style="text-align:right">${r.exited ? t('na') : (r.subA1>0 ? `<span style="color:var(--red);">${fmt(r.subA1)}</span>` : fmt(0))}</td>
      <td style="text-align:right">${r.hasLoan ? fmt(r.loanReceived) : t('na')}</td>
      <td style="text-align:center">${r.progress}</td>
      <td style="text-align:right">${r.hasLoan ? fmt(r.instB) : t('na')}</td>
      <td style="text-align:right">${r.hasLoan ? fmt(r.interestC) : t('na')}</td>
      <td style="text-align:right;font-weight:700">${fmt(r.total)}</td>
    </tr>`).join('');
  const sheetTotalA = collectionSheetRows.reduce((s,r)=>s+r.subA,0);
  const sheetTotalA1 = collectionSheetRows.reduce((s,r)=>s+r.subA1,0);
  const sheetTotalB = collectionSheetRows.reduce((s,r)=>s+r.instB,0);
  const sheetTotalC = collectionSheetRows.reduce((s,r)=>s+r.interestC,0);
  const sheetGrandTotal = collectionSheetRows.reduce((s,r)=>s+r.total,0);
  const currentMonthForSheet = new Date().toISOString().slice(0,7);
  const prevMonthBalance = balanceBreakdown().net;
  const combinedTotal = Math.round((sheetGrandTotal + prevMonthBalance)*100)/100;
  collectionSheetData = collectionSheetRows;
  const collectionSheetTotalsRow = collectionSheetRows.length ? `
    <tr style="border-top:2px solid var(--gold);font-weight:700;">
      <td></td><td>${t('total_col')}</td><td style="text-align:right">${fmt(sheetTotalA)}</td>
      <td style="text-align:right;color:var(--red)">${fmt(sheetTotalA1)}</td>
      <td></td><td></td>
      <td style="text-align:right">${fmt(sheetTotalB)}</td>
      <td style="text-align:right">${fmt(sheetTotalC)}</td>
      <td style="text-align:right;color:var(--maroon)">${fmt(sheetGrandTotal)}</td>
    </tr>` : '';

  // build bulk checklist rows: one per member, or one per (member, active loan)
  bulkRows = [];
  state.members.filter(m=>!m.exited).forEach(m=>{
    const loans = activeLoansForMember(m.id);
    const subPaid = state.subs.some(s=>s.month===bulkSubMonth && s.memberId===m.id);
    if(loans.length===0){
      bulkRows.push({idx:bulkRows.length, memberId:m.id, memberName:m.name, showSub:true, subPaid, hasLoan:false});
    } else {
      loans.forEach((entry,i)=>{
        bulkRows.push({
          idx:bulkRows.length, memberId:m.id, memberName:m.name,
          showSub: i===0, subPaid: i===0 ? subPaid : false,
          hasLoan:true, loanId:entry.loan.id, installmentNo:entry.due.no,
          dueAmount:entry.due.total, interestAmount:entry.due.interestPart
        });
      });
    }
  });
  const bulkRowsHtml = bulkRows.map(row => `
    <tr>
      <td>${row.showSub ? row.memberName : ''}</td>
      <td>${row.showSub ? (row.subPaid
          ? `<span class="tag paid">${t('paid')}</span>`
          : `<label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="chkSub_${row.idx}"><input id="amtSub_${row.idx}" type="number" value="${standardSubAmount()}" style="width:70px;padding:4px;font-size:12px;"></label>`)
        : ''}</td>
      <td>${row.hasLoan
          ? `<label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="chkLoan_${row.idx}"> ${fmt(row.dueAmount)}</label>`
          : `<span class="muted">${t('no_dues')}</span>`}</td>
      <td>${row.hasLoan ? fmt(row.interestAmount) : `<span class="muted">${t('no_dues')}</span>`}</td>
    </tr>`).join('');

  const visibleMonths = showAllHistoryMonths ? months : months.slice(0,2);
  const monthGroupsHtml = visibleMonths.map(month => {
    const paidThisMonth = state.subs.filter(s=>s.month===month);
    const paidMemberIds = new Set(paidThisMonth.map(s=>s.memberId));
    const eligible = state.members.filter(m => !m.exited && (!m.joinDate || m.joinDate.slice(0,7) <= month));
    const defaulters = eligible.filter(m => !paidMemberIds.has(m.id));
    const rows = paidThisMonth.slice().reverse().map(s => `
      <tr><td>${memberName(s.memberId)}</td><td>${fmt(s.amount)}</td><td>${s.date}</td>
      <td><button class="btn small secondary" onclick="deleteSub('${s.id}')">${t('delete')}</button></td></tr>`).join('');

    const loanPaysThisMonth = (state.loanPayments||[]).filter(p=>(p.date||'').slice(0,7)===month);
    const loanRows = loanPaysThisMonth.slice().reverse().map(p=>{
      const loan = state.loans.find(l=>l.id===p.loanId);
      return `<tr><td>${loan?memberName(loan.memberId):t('na')}</td><td>${p.no}</td><td>${fmt(p.amount)}</td><td>${p.date}</td></tr>`;
    }).join('');

    const loanEligible = state.loans.filter(l => (l.issueDate||'').slice(0,7) <= month && loanOutstanding(l) > 0);
    const paidLoanIdsThisMonth = new Set(loanPaysThisMonth.map(p=>p.loanId));
    const loanDefaulters = loanEligible.filter(l => !paidLoanIdsThisMonth.has(l.id));

    return `
      <div style="margin-bottom:16px;">
        <div style="font-family:'Noto Serif Tamil',serif;font-weight:700;color:var(--maroon);background:#F1E6CE;padding:6px 10px;border-radius:6px;margin-bottom:6px;display:inline-block;">${month}</div>
        <div class="muted" style="font-weight:600;">${t('sub_section_label')}</div>
        <div class="table-wrap">
        ${paidThisMonth.length ? `<table><thead><tr><th>${t('member')}</th><th>${t('amount')}</th><th>${t('date')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">${t('no_subs')}</div>`}
        </div>
        <div style="margin:6px 0 10px;">
          <span class="muted" style="font-weight:600;">${t('not_paid_title')}: </span>
          ${defaulters.length ? defaulters.map(m=>`<span class="tag due" style="margin:2px 4px 2px 0;display:inline-block;">${m.name}</span>`).join('') : `<span class="tag paid">${t('all_paid_month')}</span>`}
        </div>
        <div class="muted" style="font-weight:600;">${t('loan_section_label')}</div>
        <div class="table-wrap">
        ${loanPaysThisMonth.length ? `<table><thead><tr><th>${t('member')}</th><th>${t('installment_col')}</th><th>${t('amount')}</th><th>${t('date')}</th></tr></thead><tbody>${loanRows}</tbody></table>` : `<div class="empty">${t('no_loan_payments')}</div>`}
        </div>
        <div style="margin-top:6px;">
          <span class="muted" style="font-weight:600;">${t('loan_not_paid_title')}: </span>
          ${loanDefaulters.length ? loanDefaulters.map(l=>`<span class="tag due" style="margin:2px 4px 2px 0;display:inline-block;">${memberName(l.memberId)}</span>`).join('') : `<span class="tag paid">${t('all_loans_paid_month')}</span>`}
        </div>
      </div>
    `;
  }).join('');

  const memberSummaryData = state.members.map(m=>{
    const subTotal = state.subs.filter(s=>s.memberId===m.id).reduce((s,x)=>s+Number(x.amount),0);
    const memberLoans = state.loans.filter(l=>l.memberId===m.id);
    const loanTaken = memberLoans.reduce((s,l)=>s+Number(l.amount),0);
    const loanOut = memberLoans.reduce((s,l)=>s+loanOutstanding(l),0);
    const memberLoanIds = new Set(memberLoans.map(l=>l.id));
    const loanPaid = (state.loanPayments||[]).filter(p=>memberLoanIds.has(p.loanId)).reduce((s,p)=>s+Number(p.amount),0);
    let loanInterestEarned = 0;
    (state.loanPayments||[]).filter(p=>memberLoanIds.has(p.loanId)).forEach(p=>{
      if(p.interestWaived) return;
      const loan = memberLoans.find(l=>l.id===p.loanId);
      if(!loan) return;
      const row = buildSchedule(loan).find(r=>r.no===p.no);
      if(!row || !row.total) return;
      loanInterestEarned += Number(p.amount) * (row.interestPart / row.total);
    });
    loanInterestEarned = Math.round(loanInterestEarned*100)/100;
    const paidMonthsList = state.subs.filter(s=>s.memberId===m.id).map(s=>s.month).filter(Boolean);
    const earliestPaidMonth = paidMonthsList.length ? paidMonthsList.reduce((a,b)=> a<b?a:b) : null;
    const joinMonth = (m.joinDate||'').slice(0,7) || null;
    const groupStart = (state.settings && state.settings.startMonth) || groupStartMonth();
    let baseMonth = joinMonth;
    if(earliestPaidMonth && (!baseMonth || earliestPaidMonth < baseMonth)) baseMonth = earliestPaidMonth;
    if(groupStart && (!baseMonth || groupStart < baseMonth)) baseMonth = groupStart;
    let totalMonths = 0;
    if(baseMonth){
      const [sy,sm] = baseMonth.split('-').map(Number);
      const [ey,em] = currentMonth.split('-').map(Number);
      totalMonths = Math.max((ey-sy)*12 + (em-sm) + 1, 0);
    }
    const paidMonthsCount = new Set(paidMonthsList).size;
    const loanRemaining = memberLoans.reduce((s,l)=>s+remainingInstallments(l),0);
    const outstandingSubCount = Math.max(totalMonths - paidMonthsCount, 0);
    const latestLoan = memberLoans.length ? memberLoans.slice().sort((a,b)=>(b.issueDate||'').localeCompare(a.issueDate||''))[0] : null;
    return { name:m.name, exited:!!m.exited, totalMonths, subTotal, outstandingSubCount, loanTaken, loanInterestEarned, loanPaid, loanOut, loanRemaining, latestLoan };
  });
  memberSummarySnapshot = memberSummaryData;
  const memberSummaryRows = memberSummaryData.map(d => `<tr>
      <td>${d.name}${d.exited?` <span class="tag due" style="font-size:10px;">${t('exited_tag')}</span>`:''}</td>
      <td style="text-align:right">${d.totalMonths}</td>
      <td style="text-align:right">${d.exited ? t('na') : fmt(d.subTotal)}</td>
      <td style="text-align:right">${d.outstandingSubCount}</td>
      <td style="text-align:right">${fmt(d.loanTaken)}</td>
      <td style="text-align:right">${fmt(d.loanInterestEarned)}</td>
      <td style="text-align:right">${fmt(d.loanPaid)}</td>
      <td style="text-align:right">${d.latestLoan ? `${fmt(d.latestLoan.amount)} - ${shortMonthLabel((d.latestLoan.issueDate||'').slice(0,7))}` : t('na')}</td>
      <td style="text-align:right">${fmt(d.loanOut)}${d.loanRemaining>0 ? ` <span class="muted" style="font-size:11px;white-space:nowrap;">(${d.loanRemaining} ${t('remaining_label')})</span>` : ''}</td>
    </tr>`).join('');
  const summaryTotals = {
    subTotal: memberSummaryData.filter(d=>!d.exited).reduce((s,d)=>s+d.subTotal,0),
    loanTaken: memberSummaryData.reduce((s,d)=>s+d.loanTaken,0),
    loanInterestEarned: memberSummaryData.reduce((s,d)=>s+d.loanInterestEarned,0),
    loanPaid: memberSummaryData.reduce((s,d)=>s+d.loanPaid,0),
    loanOut: memberSummaryData.reduce((s,d)=>s+d.loanOut,0)
  };
  const memberSummaryTotalsRow = memberSummaryData.length ? `
    <tr style="border-top:2px solid var(--gold);font-weight:700;">
      <td>${t('total_col')}</td><td></td>
      <td style="text-align:right">${fmt(summaryTotals.subTotal)}</td><td></td>
      <td style="text-align:right">${fmt(summaryTotals.loanTaken)}</td>
      <td style="text-align:right;color:var(--maroon)">${fmt(summaryTotals.loanInterestEarned)}</td>
      <td style="text-align:right">${fmt(summaryTotals.loanPaid)}</td>
      <td></td>
      <td style="text-align:right">${fmt(summaryTotals.loanOut)}</td>
    </tr>` : '';

  return `
    <div class="card">
      <h2>${t('collection_sheet_title')}</h2>
      <p style="font-family:'Noto Serif Tamil',serif;font-weight:700;color:var(--maroon);margin:-6px 0 10px;">${monthLabel(currentMonth)}</p>
      <div class="table-wrap">
        <table><thead><tr>
          <th>${t('sl_no')}</th><th>${t('member')}</th><th style="text-align:right">${t('sub_col_a')}</th>
          <th style="text-align:right">${t('sub_col_a1')}</th>
          <th style="text-align:right">${t('loan_received_col')}</th><th style="text-align:center">${t('installment_progress_col')}</th>
          <th style="text-align:right">${t('installment_amt_col')}</th><th style="text-align:right">${t('interest_amt_col')}</th>
          <th style="text-align:right">${t('grand_total_col_a1')}</th>
        </tr></thead>
        <tbody>${collectionSheetHtml || `<tr><td colspan="9" class="empty">${t('no_members')}</td></tr>`}${collectionSheetTotalsRow}</tbody></table>
      </div>
      <table style="margin-top:10px;">
        <tr><td>${t('prev_month_balance_label')}</td><td style="text-align:right;font-weight:600">${fmt(prevMonthBalance)}</td></tr>
        <tr><td style="font-weight:700;border-top:2px solid var(--paper-line)">${t('combined_total_label')}</td><td style="text-align:right;font-weight:700;border-top:2px solid var(--paper-line);color:var(--maroon)">${fmt(combinedTotal)}</td></tr>
      </table>
      <div class="export-row" style="margin-top:10px;">
        <button class="btn gold" onclick="exportCollectionSheetPDF()">${t('export_pdf')}</button>
        <button class="btn" onclick="exportCollectionSheetJPEG()">${t('export_jpeg')}</button>
      </div>
    </div>
    <div class="card">
      <h2>${t('history_sheet_title')}</h2>
      <div class="field" style="max-width:260px;">
        <label>${t('select_month_label')} — <span style="color:var(--maroon);font-weight:700;">${monthLabel(historySheetMonth)}</span></label>
        <select onchange="setHistorySheetMonth(this.value)">
          ${months.map(mo=>`<option value="${mo}" ${mo===historySheetMonth?'selected':''}>${monthLabel(mo)}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap">
        <table><thead><tr>
          <th>${t('sl_no')}</th><th>${t('member')}</th><th style="text-align:right">${t('sub_paid_col')}</th>
          <th style="text-align:right">${t('principal_paid_col')}</th><th style="text-align:right">${t('interest_paid_col')}</th>
          <th style="text-align:right">${t('total_col')}</th>
        </tr></thead>
        <tbody>${historyRows || `<tr><td colspan="6" class="empty">${t('no_members')}</td></tr>`}${historyTotalsRow}</tbody></table>
      </div>
      <div class="export-row" style="margin-top:10px;">
        <button class="btn gold" onclick="exportHistorySheetPDF()">${t('export_pdf')}</button>
        <button class="btn" onclick="exportHistorySheetJPEG()">${t('export_jpeg')}</button>
      </div>
    </div>
    <div class="card">
      <h2>${t('bulk_entry_title')}</h2>
      <div class="grid">
        <div class="field"><label>${t('month')}</label><input id="bulkMonth" type="month" value="${bulkSubMonth}" onchange="setBulkMonth(this.value)"></div>
        <div class="field"><label>${t('date')}</label><input id="bulkDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:6px;font-weight:600;">
          <input type="checkbox" id="selectAllBulk" onchange="toggleSelectAllBulk(this.checked)">
          ${t('select_all_label')}
        </label>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>${t('member')}</th><th>${t('monthly_sub_col')}</th><th>${t('loan_due_col')}</th><th>${t('interest_due_col')}</th></tr></thead>
        <tbody>${bulkRowsHtml || `<tr><td colspan="4" class="empty">${t('no_members')}</td></tr>`}</tbody></table>
      </div>
      <button class="btn" style="margin-top:10px;" onclick="processBulkEntry()">${t('record_selected')}</button>
    </div>
    <div class="card">
      <h2>${t('sub_title')}</h2>
      <div class="grid">
        <div class="field"><label>${t('member')}</label>
          <select id="sMember" class="member-select"><option value="">${t('select_member')}</option>${memberOptions()}</select>
        </div>
        <div class="field"><label>${t('month')}</label><input id="sMonth" type="month" value="${new Date().toISOString().slice(0,7)}"></div>
        <div class="field"><label>${t('amount')}</label><input id="sAmount" type="number" value="${standardSubAmount()}"></div>
        <div class="field"><label>${t('date')}</label><input id="sDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <button class="btn" onclick="addSub()">${t('record_payment')}</button>
    </div>
    <div class="card">
      <h2>${t('combined_history_title')}</h2>
      ${months.length > 2 ? `<button class="btn small secondary" style="margin-bottom:10px;" onclick="toggleHistoryMonths()">${showAllHistoryMonths ? t('show_less_months') : t('show_more_months')}</button>` : ''}
      ${visibleMonths.length ? monthGroupsHtml : `<div class="empty">${t('no_subs')}</div>`}
    </div>
    <div class="card">
      <h2>${t('member_summary_title')} — ${monthLabel(currentMonth)}</h2>
      <div class="table-wrap">
      ${state.members.length ? `<table><thead><tr><th>${t('member')}</th><th style="text-align:right">${t('total_months_col')}</th><th style="text-align:right">${t('total_sub_paid_col')}</th><th style="text-align:right">${t('outstanding_sub_count_col')}</th><th style="text-align:right">${t('loan_taken_col')}</th><th style="text-align:right">${t('loan_interest_earned_col')}</th><th style="text-align:right">${t('loan_paid_col')}</th><th style="text-align:right">${t('current_loan_col')}</th><th style="text-align:right">${t('loan_outstanding_col')}</th></tr></thead><tbody>${memberSummaryRows}${memberSummaryTotalsRow}</tbody></table>` : `<div class="empty">${t('no_members')}</div>`}
      </div>
      <div class="export-row" style="margin-top:10px;">
        <button class="btn gold" onclick="exportMemberSummaryPDF()">${t('export_pdf')}</button>
        <button class="btn" onclick="exportMemberSummaryJPEG()">${t('export_jpeg')}</button>
      </div>
    </div>
  `;
}
function recordSubPayment(memberId, month, amount, date){
  state.subs.push({id:uid(), memberId, month, amount, date});
}
function addSub(){
  const memberId = document.getElementById('sMember').value;
  if(!memberId){ alert(t('req_member')); return; }
  const month = document.getElementById('sMonth').value;
  const amount = Number(document.getElementById('sAmount').value)||0;
  const date = document.getElementById('sDate').value;
  recordSubPayment(memberId, month, amount, date);
  saveState(); render();
}
function deleteSub(id){ state.subs = state.subs.filter(s=>s.id!==id); saveState(); render(); }
function setHistorySheetMonth(v){ historySheetMonth = v; render(); }
function toggleHistoryMonths(){ showAllHistoryMonths = !showAllHistoryMonths; render(); }
function toggleMonthlyReport(){ showAllMonthlyReport = !showAllMonthlyReport; render(); }
function activeLoansForMember(memberId){
  return state.loans.filter(l=>l.memberId===memberId).map(l=>({loan:l, due:nextDueInstallment(l)})).filter(x=>x.due);
}
function setBulkMonth(v){ bulkSubMonth = v; render(); }
function toggleSelectAllBulk(checked){
  bulkRows.forEach(row=>{
    if(row.showSub && !row.subPaid){
      const el = document.getElementById('chkSub_'+row.idx);
      if(el) el.checked = checked;
    }
    if(row.hasLoan){
      const el2 = document.getElementById('chkLoan_'+row.idx);
      if(el2) el2.checked = checked;
    }
  });
}
function processBulkEntry(){
  const month = document.getElementById('bulkMonth').value;
  const date = document.getElementById('bulkDate').value;
  bulkRows.forEach(row=>{
    if(row.showSub && !row.subPaid){
      const chk = document.getElementById('chkSub_'+row.idx);
      if(chk && chk.checked){
        const amtEl = document.getElementById('amtSub_'+row.idx);
        const amount = Number(amtEl.value)||standardSubAmount();
        recordSubPayment(row.memberId, month, amount, date);
      }
    }
    if(row.hasLoan){
      const chkL = document.getElementById('chkLoan_'+row.idx);
      if(chkL && chkL.checked){
        recordLoanPayment(row.loanId, row.installmentNo, row.dueAmount, date);
      }
    }
  });
  saveState(); render();
}

function suggestedNextBorrower(){
  const activeMembers = state.members.filter(m=>!m.exited);
  if(!activeMembers.length) return null;
  const noLoanMembers = activeMembers.filter(m => !state.loans.some(l=>l.memberId===m.id));
  if(noLoanMembers.length){
    const sorted = noLoanMembers.slice().sort((a,b)=>(a.joinDate||'').localeCompare(b.joinDate||''));
    return { member: sorted[0], reason: 'never' };
  }
  const withLastLoanDate = activeMembers.map(m=>{
    const loans = state.loans.filter(l=>l.memberId===m.id);
    const lastDate = loans.reduce((max,l)=> (l.issueDate||'') > max ? l.issueDate : max, '');
    return { member: m, lastDate };
  });
  withLastLoanDate.sort((a,b)=>a.lastDate.localeCompare(b.lastDate));
  return { member: withLastLoanDate[0].member, reason: 'longest' };
}
function selectSuggestedBorrower(memberId){
  const sel = document.getElementById('lMember');
  if(sel) sel.value = memberId;
}
function renderLoans(){
  const editing = editingLoanId ? state.loans.find(l=>l.id===editingLoanId) : null;
  const hasPayments = editing ? (state.loanPayments||[]).some(p=>p.loanId===editing.id) : false;

  const loanRowHtml = (l, no) => {
    const out = loanOutstanding(l);
    const nd = nextDueInstallment(l);
    const remaining = remainingInstallments(l);
    return `<tr>
      <td>${no}</td><td>${memberName(l.memberId)}</td><td>${fmt(l.amount)}</td>
      <td><span class="badge-installments">${l.installments}</span></td>
      <td>${fmt(out)}${remaining>0 ? ` <span class="muted" style="font-size:11px;white-space:nowrap;">(${remaining} ${t('remaining_label')})</span>` : ''}</td>

      <td class="row-actions">
        <button class="btn small gold" onclick="openSchedule('${l.id}')">${t('view_schedule')}</button>
        <button class="btn small secondary" onclick="editLoan('${l.id}')">${t('edit')}</button>
        <button class="btn small secondary" onclick="deleteLoan('${l.id}')">${t('delete')}</button>
      </td>
    </tr>`;
  };

  // group loans by the month they were issued in, most recent month first
  function buildLoanGroupsHtml(loansList){
    const sorted = loansList.slice().sort((a,b)=>(b.issueDate||'').localeCompare(a.issueDate||''));
    const groups = {};
    const order = [];
    sorted.forEach(l=>{
      const month = (l.issueDate||'').slice(0,7) || t('na');
      if(!groups[month]){ groups[month]=[]; order.push(month); }
      groups[month].push(l);
    });
    return order.map(month => `
      <div class="table-wrap" style="margin-bottom:14px;">
        <div style="font-family:'Noto Serif Tamil',serif;font-weight:700;color:var(--maroon);background:#F1E6CE;padding:6px 10px;border-radius:6px;margin-bottom:6px;display:inline-block;">${month}</div>
        <table><thead><tr><th>${t('loan_no')}</th><th>${t('member')}</th><th>${t('principal')}</th><th></th><th>${t('outstanding')}</th><th>${t('next_due')}</th><th></th></tr></thead>
        <tbody>${groups[month].map((l,i)=>loanRowHtml(l,l.loanNumber||i+1)).join('')}</tbody></table>
      </div>
    `).join('');
  }
  const loansWithBalance = state.loans.filter(l => loanOutstanding(l) > 0);
  const fullyPaidLoansList = state.loans.filter(l => loanOutstanding(l) <= 0);
  loansWithBalanceData = loansWithBalance;
  fullyPaidLoansData = fullyPaidLoansList;
  const withBalanceHtml = buildLoanGroupsHtml(loansWithBalance);
  const fullyPaidHtml = buildLoanGroupsHtml(fullyPaidLoansList);

  return `
    <div class="card">
      <h2>${editing ? t('edit_loan_title') : t('loan_title')}</h2>
      ${editing && hasPayments ? `<p class="muted" style="color:var(--red)">${t('has_payments_warn')}</p>` : ''}
      <div class="stat" style="margin-bottom:12px;text-align:left;padding:10px 14px;">
        <div class="lbl">${t('current_available_balance_label')}</div>
        <div class="num" style="font-size:20px;">${fmt(balanceBreakdown().net)}</div>
      </div>
      ${!editing ? (() => {
        const suggestion = suggestedNextBorrower();
        if(!suggestion) return `<p class="muted">${t('rotation_no_members')}</p>`;
        return `<div style="background:#F1E6CE;border-radius:8px;padding:10px 12px;margin-bottom:12px;">
          <div class="muted" style="font-weight:600;">${t('rotation_suggestion_label')}</div>
          <div style="font-family:'Noto Serif Tamil',serif;font-weight:700;color:var(--maroon);font-size:16px;margin:2px 0;">${suggestion.member.name}</div>
          <div class="muted" style="font-size:12px;">${suggestion.reason==='never' ? t('rotation_never_had_loan') : t('rotation_longest_since')}</div>
          <button class="btn small gold" style="margin-top:6px;" onclick="selectSuggestedBorrower('${suggestion.member.id}')">${t('rotation_select_button')}</button>
        </div>`;
      })() : ''}
      <div class="grid">
        <div class="field"><label>${t('member')}</label>
          <select id="lMember" class="member-select"><option value="">${t('select_member')}</option>${memberOptions(editing?editing.memberId:null)}</select>
        </div>
        <div class="field"><label>${t('loan_amount')}</label><input id="lAmount" type="number" value="${editing?editing.amount:''}"></div>
        <div class="field"><label>${t('rate')}</label><input id="lRate" type="number" step="0.1" value="${editing?editing.rate:2}"></div>
        <div class="field"><label>${t('installments')}</label><input id="lInstallments" type="number" value="${editing?editing.installments:10}" min="2" max="20"></div>
        <div class="field"><label>${t('issue_date')}</label><input id="lDate" type="date" value="${editing?editing.issueDate:new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="row-actions">
        <button class="btn" onclick="addLoan()">${editing ? t('update_loan') : t('issue_loan')}</button>
        ${editing ? `<button class="btn secondary" onclick="cancelEditLoan()">${t('cancel_edit')}</button>` : ''}
      </div>
    </div>
    <div class="card">
      <h2>${t('active_loans')}</h2>
      ${loansWithBalance.length ? withBalanceHtml : `<div class="empty">${t('no_active_loans_with_balance')}</div>`}
      <div class="export-row">
        <button class="btn gold" onclick="exportLoansListPDF()">${t('export_pdf')}</button>
        <button class="btn" onclick="exportLoansListJPEG()">${t('export_jpeg')}</button>
      </div>
    </div>
    <div class="card">
      <button class="btn secondary" onclick="toggleFullyPaidLoans()">${showFullyPaidLoans ? t('hide_fully_paid') : t('show_fully_paid')}</button>
      ${showFullyPaidLoans ? `
        <h2 style="margin-top:12px;">${t('fully_paid_loans_title')}</h2>
        ${fullyPaidLoansList.length ? fullyPaidHtml : `<div class="empty">${t('no_fully_paid_loans')}</div>`}
      ` : ''}
    </div>
    <div id="scheduleModalHost"></div>
  `;
}
function addLoan(){
  const memberId = document.getElementById('lMember').value;
  if(!memberId){ alert(t('req_member')); return; }
  const amount = Number(document.getElementById('lAmount').value)||0;
  if(!amount){ alert(t('req_amount')); return; }
  const rate = Number(document.getElementById('lRate').value)||0;
  const installments = Number(document.getElementById('lInstallments').value)||10;
  const issueDate = document.getElementById('lDate').value;
  if(editingLoanId){
    const loan = state.loans.find(l=>l.id===editingLoanId);
    Object.assign(loan, {memberId, amount, rate, installments, issueDate});
    syncLoanDisbursementTxn(loan);
    editingLoanId = null;
  } else {
    const nextNo = state.loans.reduce((max,l)=>Math.max(max, l.loanNumber||0), 0) + 1;
    const loan = {id:uid(), loanNumber:nextNo, memberId, amount, rate, installments, issueDate};
    state.loans.push(loan);
    syncLoanDisbursementTxn(loan);
  }
  saveState(); render();
}
function syncLoanDisbursementTxn(loan){
  if(!state.transactions) state.transactions = [];
  let txn = state.transactions.find(x=>x.sourceType==='loan' && x.sourceId===loan.id);
  const data = { type:'expense', category:t('loan_disbursement'), amount:loan.amount, date:loan.issueDate, note:memberName(loan.memberId), auto:true, sourceType:'loan', sourceId:loan.id };
  if(txn) Object.assign(txn, data);
  else state.transactions.push({id:uid(), ...data});
}

  if(!loan) return '';

  const orgName = (state.settings && state.settings.orgName) || '';
  const rows = sched.map(r=>{
    const paid = isInstallmentPaid(loanId, r.no);
    const dueMonth = installmentDueMonth(loan.issueDate, r.no);
    return `<tr>
      <td style="${reportTdStyle()}">${r.no} — ${monthLabel(dueMonth)}</td><td style="${reportTdStyle('right')}">${r.factor}%</td>
      <td style="${reportTdStyle('right')}">${fmt(r.principalPart)}</td><td style="${reportTdStyle('right')}">${fmt(r.interestPart)}</td>
      <td style="${reportTdStyle('right')}"><strong>${fmt(r.total)}</strong></td>
      <td style="${reportTdStyle('center')}">${paid?t('paid'):t('due')}</td>
    </tr>`;
  }).join('');
  let html = orgName ? reportHeaderHtml(orgName) : '';
  html += `
    <table style="width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px;">
      <tr><td style="padding:4px 6px;color:#5B4F41;">${t('loan_no')}</td><td style="padding:4px 6px;font-weight:700;">${loan.loanNumber || t('na')}</td></tr>
      <tr><td style="padding:4px 6px;color:#5B4F41;">${t('borrower_name_label')}</td><td style="padding:4px 6px;font-weight:700;">${memberName(loan.memberId)}</td></tr>
      <tr><td style="padding:4px 6px;color:#5B4F41;">${t('loan_issue_month_label')}</td><td style="padding:4px 6px;font-weight:700;">${monthLabel((loan.issueDate||'').slice(0,7))}</td></tr>
      <tr><td style="padding:4px 6px;color:#5B4F41;">${t('loan_amount_label')}</td><td style="padding:4px 6px;font-weight:700;">${fmt(loan.amount)}</td></tr>
    </table>
    <div style="font-family:'Noto Serif Tamil',serif;font-weight:700;font-size:16px;color:#7A1E3A;margin-bottom:8px;">${t('schedule_heading')}</div>
    <table style="${reportTableStyle()}">
      <thead><tr>
        <th style="${reportThStyle()}">${t('installment_no')}</th><th style="${reportThStyle()}text-align:right;">${t('factor')}</th>
        <th style="${reportThStyle()}text-align:right;">${t('principal_part')}</th><th style="${reportThStyle()}text-align:right;">${t('interest_part')}</th>
        <th style="${reportThStyle()}text-align:right;">${t('total')}</th><th style="${reportThStyle()}text-align:center;">${t('status')}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  return html;
}

  downloadCanvasPDF(canvas, `loan-schedule-${memberName(loan.memberId)}-${(loan.issueDate||'').slice(0,7)}`);
}

  if(!loan) return;
  const canvas = await captureNodeCanvas(buildScheduleHtml(loanId));
  downloadCanvasJPEG(canvas, `loan-schedule-${memberName(loan.memberId)}-${(loan.issueDate||'').slice(0,7)}`);

function editLoan(id){ editingLoanId = id; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function toggleFullyPaidLoans(){ showFullyPaidLoans = !showFullyPaidLoans; render(); }
function cancelEditLoan(){ editingLoanId = null; render(); }
function deleteLoan(id){
  showConfirm(t('confirm_delete_loan'), function(){
    const paymentIds = (state.loanPayments||[]).filter(p=>p.loanId===id).map(p=>p.id);
    state.loans = state.loans.filter(l=>l.id!==id);
    state.loanPayments = (state.loanPayments||[]).filter(p=>p.loanId!==id);
    state.transactions = (state.transactions||[]).filter(x=>
      !(x.sourceType==='loan' && x.sourceId===id) &&
      !(x.sourceType==='loan_payment' && paymentIds.includes(x.sourceId))
    );
    if(editingLoanId===id) editingLoanId = null;
    saveState(); render();
  });
}
function openSchedule(loanId){
  const loan = state.loans.find(l=>l.id===loanId);
  const sched = buildSchedule(loan);
  const rows = sched.map(row => {
    const paid = isInstallmentPaid(loanId, row.no);
    const isEntering = paymentEntryRow && paymentEntryRow.loanId===loanId && paymentEntryRow.no===row.no;
    let actionCell;
    if(paid){
      actionCell = `<button class="btn small secondary" onclick="undoLoanPayment('${loanId}',${row.no})">${t('undo_payment')}</button>`;
    } else if(isEntering){
      actionCell = `
        <div style="display:flex;flex-direction:column;gap:5px;min-width:230px;">
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
            <input id="payAmount" type="number" value="${row.total}" style="width:90px;padding:5px;font-size:12px;">
            <input id="payDate" type="date" value="${new Date().toISOString().slice(0,10)}" style="width:120px;padding:5px;font-size:12px;">
          </div>
          <label style="font-size:11px;display:flex;align-items:center;gap:4px;">
            <input type="checkbox" id="payNoInterest" onchange="document.getElementById('payAmount').value = this.checked ? ${row.principalPart} : ${row.total}">
            ${t('pay_without_interest')}
          </label>
          <div style="display:flex;gap:4px;">
            <button class="btn small" onclick="savePayment('${loanId}',${row.no})">${t('save')}</button>
            <button class="btn small secondary" onclick="cancelRecordPayment()">${t('cancel_entry')}</button>
          </div>
        </div>`;
    } else {
      actionCell = `<button class="btn small" onclick="startRecordPayment('${loanId}',${row.no})">${t('record_repayment')}</button>`;
    }
    const waivedPayment = paid ? (state.loanPayments||[]).find(p=>p.loanId===loanId && p.no===row.no) : null;
    return `<tr>
      <td>${row.no} — ${monthLabel(installmentDueMonth(loan.issueDate, row.no))}</td><td>${row.factor}%</td><td>${fmt(row.principalPart)}</td><td>${fmt(row.interestPart)}</td><td><strong>${fmt(row.total)}</strong></td>
      <td><span class="tag ${paid?'paid':'due'}">${paid?t('paid'):t('due')}</span>${waivedPayment&&waivedPayment.interestWaived?` <span class="badge-installments">${t('pay_without_interest')}</span>`:''}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');
  const remainingCount = sched.filter(row=>!isInstallmentPaid(loanId, row.no)).length;
  const forecloseAmount = foreclosureRemainingPrincipal(loan);
  const remainingUnpaidRows = sched.filter(row=>!isInstallmentPaid(loanId, row.no));
  const partialFirstRow = remainingUnpaidRows[0];
  const partialRestRows = remainingUnpaidRows.slice(1);
  const partialRestAmount = partialRestRows.reduce((s,r)=>s+r.principalPart,0);
  const partialTotalAmount = partialFirstRow ? Math.round((partialFirstRow.total + partialRestAmount)*100)/100 : 0;
  document.getElementById('scheduleModalHost').innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(43,33,24,0.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;z-index:50;overflow-y:auto;" onclick="if(event.target===this) closeSchedule()">
      <div class="card" style="max-width:860px;width:100%;margin-top:10px;">
        <h2>${t('schedule_title')} — ${memberName(loan.memberId)} (${t('loan_no')}: ${loan.loanNumber || t('na')})</h2>
        <p style="font-family:'Noto Serif Tamil',serif;font-weight:700;color:var(--maroon);margin:-6px 0 10px;">${t('loan_issue_month_label')}: ${monthLabel((loan.issueDate||'').slice(0,7))}</p>
        <div class="table-wrap schedule-mini">
        <table><thead><tr><th>${t('installment_no')}</th><th>${t('factor')}</th><th>${t('principal_part')}</th><th>${t('interest_part')}</th><th>${t('total')}</th><th>${t('status')}</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
        </div>
        <div class="export-row" style="margin-top:10px;">
          <button class="btn gold" onclick="exportSchedulePDF('${loanId}')">${t('export_pdf')}</button>
          <button class="btn" onclick="exportScheduleJPEG('${loanId}')">${t('export_jpeg')}</button>
        </div>
        ${remainingCount>1 ? `
        <div class="divider"></div>
        <h2>${t('foreclose_title')}</h2>
        <p class="muted">${t('foreclose_note')}</p>
        <div class="grid">
          <div class="field"><label>${t('foreclose_amount_label')}</label><input type="text" value="${fmt(forecloseAmount)}" disabled></div>
          <div class="field"><label>${t('date')}</label><input id="forecloseDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <button class="btn gold" onclick="foreclosureLoan('${loanId}')">${t('foreclose_button')}</button>
        ${remainingCount>=2 ? `
        <div class="divider"></div>
        <h2>${t('partial_foreclose_title')}</h2>
        <p class="muted">${t('partial_foreclose_note')}</p>
        <div class="grid">
          <div class="field"><label>${t('partial_foreclose_amount_label')}</label><input type="text" value="${fmt(partialTotalAmount)}" disabled></div>
          <div class="field"><label>${t('date')}</label><input id="partialForecloseDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <button class="btn gold" onclick="partialForeclosureLoan('${loanId}')">${t('partial_foreclose_button')}</button>
        ` : ''}
        ` : ''}
        <button class="btn secondary" style="margin-top:12px;" onclick="closeSchedule()">${t('close')}</button>
      </div>
    </div>
  `;
}
function closeSchedule(){ paymentEntryRow = null; document.getElementById('scheduleModalHost').innerHTML=''; }
function startRecordPayment(loanId, no){ paymentEntryRow = {loanId, no}; openSchedule(loanId); }
function cancelRecordPayment(){ const lid = paymentEntryRow ? paymentEntryRow.loanId : null; paymentEntryRow = null; if(lid) openSchedule(lid); }
function recordLoanPayment(loanId, no, amount, date, opts){
  opts = opts || {};
  if(!state.loanPayments) state.loanPayments = [];
  const payment = {id:uid(), loanId, no, date, amount, interestWaived: !!opts.interestWaived};
  state.loanPayments.push(payment);
  if(!state.transactions) state.transactions = [];
  const loan = state.loans.find(l=>l.id===loanId);
  state.transactions.push({
    id:uid(), type:'income', category: opts.interestWaived ? t('foreclosure_txn_label') : t('loan_repayment'), amount, date,
    note: `${memberName(loan.memberId)} — ${t('installment_no')} ${no}`,
    auto:true, sourceType:'loan_payment', sourceId: payment.id
  });
}
function undoLoanPayment(loanId, no){
  const payment = (state.loanPayments||[]).find(p=>p.loanId===loanId && p.no===no);
  if(!payment) return;
  showConfirm(t('confirm_undo_payment'), function(){
    state.loanPayments = state.loanPayments.filter(p=>p.id!==payment.id);
    state.transactions = (state.transactions||[]).filter(x=>!(x.sourceType==='loan_payment' && x.sourceId===payment.id));
    saveState();
    render();
    openSchedule(loanId);
  });
}
function foreclosureRemainingPrincipal(loan){
  const sched = buildSchedule(loan);
  const paidNos = new Set((state.loanPayments||[]).filter(p=>p.loanId===loan.id).map(p=>p.no));
  return Math.round(sched.filter(r=>!paidNos.has(r.no)).reduce((s,r)=>s+r.principalPart,0)*100)/100;
}
function foreclosureLoan(loanId){
  const loan = state.loans.find(l=>l.id===loanId);
  const sched = buildSchedule(loan);
  const paidNos = new Set((state.loanPayments||[]).filter(p=>p.loanId===loanId).map(p=>p.no));
  const remainingRows = sched.filter(r=>!paidNos.has(r.no));
  if(!remainingRows.length) return;
  const date = document.getElementById('forecloseDate').value || new Date().toISOString().slice(0,10);
  showConfirm(t('foreclose_confirm').replace('{n}', remainingRows.length), function(){
    remainingRows.forEach(row=>{
      recordLoanPayment(loanId, row.no, row.principalPart, date, {interestWaived:true});
    });
    saveState();
    render();
    openSchedule(loanId);
  });
}
function partialForeclosureLoan(loanId){
  const loan = state.loans.find(l=>l.id===loanId);
  const sched = buildSchedule(loan);
  const paidNos = new Set((state.loanPayments||[]).filter(p=>p.loanId===loanId).map(p=>p.no));
  const remainingRows = sched.filter(r=>!paidNos.has(r.no));
  if(remainingRows.length < 2) return;
  const firstRow = remainingRows[0];
  const restRows = remainingRows.slice(1);
  const restAmount = Math.round(restRows.reduce((s,r)=>s+r.principalPart,0)*100)/100;
  const date = document.getElementById('partialForecloseDate').value || new Date().toISOString().slice(0,10);
  const msg = t('partial_foreclose_confirm')
    .replace('{first}', firstRow.no)
    .replace('{firstAmt}', fmt(firstRow.total))
    .replace('{n}', restRows.length)
    .replace('{restAmt}', fmt(restAmount));
  showConfirm(msg, function(){
    recordLoanPayment(loanId, firstRow.no, firstRow.total, date, {interestWaived:false});
    restRows.forEach(row=>{
      recordLoanPayment(loanId, row.no, row.principalPart, date, {interestWaived:true});
    });
    saveState();
    render();
    openSchedule(loanId);
  });
}
function savePayment(loanId, no){
  const amount = Number(document.getElementById('payAmount').value)||0;
  const date = document.getElementById('payDate').value;
  const noInterestEl = document.getElementById('payNoInterest');
  const interestWaived = noInterestEl ? noInterestEl.checked : false;
  if(!amount){ alert(t('req_amount')); return; }
  recordLoanPayment(loanId, no, amount, date, {interestWaived});
  paymentEntryRow = null;
  saveState();
  render();
  openSchedule(loanId);
}

function renderLedger(){
  const txnMonths = Array.from(new Set(state.transactions.map(x=>(x.date||'').slice(0,7)).filter(Boolean))).sort((a,b)=>b.localeCompare(a));
  const visibleTxnMonths = showAllLedgerMonths ? txnMonths : txnMonths.slice(0,2);
  const ledgerGroupsHtml = visibleTxnMonths.map(month=>{
    const monthTxns = state.transactions.filter(x=>(x.date||'').slice(0,7)===month).slice().reverse();
    const monthIncome = monthTxns.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0);
    const monthExpense = monthTxns.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
    const rows = monthTxns.map(x => `

function addTxn(){
  const type = document.getElementById('tType').value;
  const amount = Number(document.getElementById('tAmount').value)||0;
  if(!amount){ alert(t('req_amount')); return; }
  const category = document.getElementById('tCategory').value.trim();
  const date = document.getElementById('tDate').value;
  const note = document.getElementById('tNote').value.trim();
  state.transactions.push({id:uid(), type, amount, category, date, note});

function deleteTxn(id){
  const x = state.transactions.find(t=>t.id===id);

  state.transactions = state.transactions.filter(x=>x.id!==id);
  saveState(); render();
}

function exportJSONBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `nidhi-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImportBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.members)){
        throw new Error('invalid structure');
      }
    }catch(err){
      document.getElementById('importBackupResult').innerHTML = `<p class="muted" style="color:var(--red);margin-top:8px;">${t('backup_import_error')}</p>`;
      return;
    }
    showConfirm(t('backup_import_confirm'), function(){
      state = parsed;
      if(!state.settings) state.settings = {};
      if(!state.loanPayments) state.loanPayments = [];
      if(!state.cycles) state.cycles = [];
      saveState();
      render();
      document.getElementById('importBackupResult').innerHTML = `<p class="muted" style="color:var(--green);margin-top:8px;">${t('backup_import_success')}</p>`;
    });
  };
  reader.readAsText(file);
}
function resetAllData(){
  showConfirm(t('reset_app_confirm'), function(){
    state = { members:[], subs:[], loans:[], transactions:[], loanPayments:[], settings:{}, cycles:[] };
    saveState(); render();
  });
}
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const membersSheet = XLSX.utils.json_to_sheet(state.members.map(m=>({Name:m.name, Phone:m.phone, Address:m.address, JoinDate:m.joinDate})));
  XLSX.utils.book_append_sheet(wb, membersSheet, 'Members');

  const subsSheet = XLSX.utils.json_to_sheet(state.subs.map(s=>({Member:memberName(s.memberId), Month:s.month, Amount:s.amount, Date:s.date})));
  XLSX.utils.book_append_sheet(wb, subsSheet, 'Subscriptions');

  const loanRows = state.loans.map((l,i)=>({LoanNo:l.loanNumber||i+1, Member:memberName(l.memberId), Amount:l.amount, RatePercent:l.rate, Installments:l.installments, IssueDate:l.issueDate, Outstanding:loanOutstanding(l)}));
  const loansSheet = XLSX.utils.json_to_sheet(loanRows);
  XLSX.utils.book_append_sheet(wb, loansSheet, 'Loans');

  let scheduleRows = [];
  state.loans.forEach((l,i)=>{
    buildSchedule(l).forEach(row=>{
      scheduleRows.push({LoanNo:l.loanNumber||i+1, Member:memberName(l.memberId), Installment:row.no, InterestPercent:row.factor, PrincipalPart:row.principalPart, InterestPart:row.interestPart, Total:row.total, Status: isInstallmentPaid(l.id,row.no)?'Paid':'Due'});
    });
  });
  const scheduleSheet = XLSX.utils.json_to_sheet(scheduleRows);
  XLSX.utils.book_append_sheet(wb, scheduleSheet, 'Loan Schedule');

  const paymentRows = (state.loanPayments||[]).map(p=>{
    const loan = state.loans.find(l=>l.id===p.loanId);
    return {Member: loan?memberName(loan.memberId):'-', Installment:p.no, AmountReceived:p.amount, Date:p.date, InterestWaived: p.interestWaived ? 'Yes' : 'No'};
  });
  const paymentsSheet = XLSX.utils.json_to_sheet(paymentRows);
  XLSX.utils.book_append_sheet(wb, paymentsSheet, 'Loan Payments');

  const txnSheet = XLSX.utils.json_to_sheet(state.transactions.map(x=>({Type:x.type, Category:x.category, Amount:x.amount, Date:x.date, Note:x.note})));
  XLSX.utils.book_append_sheet(wb, txnSheet, 'Income-Expense');

  XLSX.writeFile(wb, 'nidhi-ledger-report.xlsx');
}

        <th style="${reportThStyle()}text-align:right;">${t('sub_col_a')}</th><th style="${reportThStyle()}text-align:right;">${t('sub_col_a1')}</th>
        <th style="${reportThStyle()}text-align:right;">${t('loan_received_col')}</th>
        <th style="${reportThStyle()}text-align:center;">${t('installment_progress_col')}</th><th style="${reportThStyle()}text-align:right;">${t('installment_amt_col')}</th>
        <th style="${reportThStyle()}text-align:right;">${t('interest_amt_col')}</th><th style="${reportThStyle()}text-align:right;">${t('grand_total_col_a1')}</th>
      </tr></thead>
      <tbody>${rows}
        <tr style="border-top:2px solid #A9791F;font-weight:700;">
          <td style="${reportTdStyle()}"></td><td style="${reportTdStyle()}">${t('total_col')}</td>
          <td style="${reportTdStyle('right')}">${fmt(totalA)}</td><td style="${reportTdStyle('right')}">${fmt(totalA1)}</td>
          <td style="${reportTdStyle()}"></td><td style="${reportTdStyle()}"></td>
          <td style="${reportTdStyle('right')}">${fmt(totalB)}</td><td style="${reportTdStyle('right')}">${fmt(totalC)}</td>
          <td style="${reportTdStyle('right')}">${fmt(totalAll)}</td>
        </tr>
      </tbody>
    </table>
    <table style="width:60%;margin-left:auto;border-collapse:collapse;font-size:13.5px;">
      <tr><td style="padding:6px;">${t('prev_month_balance_label')}</td><td style="padding:6px;text-align:right;font-weight:700;">${fmt(prevMonthBalance)}</td></tr>
      <tr><td style="padding:6px;border-top:2px solid #A9791F;font-weight:700;">${t('combined_total_label')}</td><td style="padding:6px;border-top:2px solid #A9791F;text-align:right;font-weight:700;color:#7A1E3A;">${fmt(combinedTotal)}</td></tr>
    </table>`;
}
async function exportCollectionSheetPDF(){
  const canvas = await captureNodeCanvas(buildCollectionSheetHtml(), 1100);
  downloadCanvasPDF(canvas, `collection-sheet-${new Date().toISOString().slice(0,7)}`);
}
async function exportCollectionSheetJPEG(){
  const canvas = await captureNodeCanvas(buildCollectionSheetHtml(), 1100);
  downloadCanvasJPEG(canvas, `collection-sheet-${new Date().toISOString().slice(0,7)}`);
}
function simpleTableHtml(title, headers, rows){
  const thead = headers.map(h=>`<th style="${reportThStyle()}${h.align?`text-align:${h.align};`:''}">${h.label}</th>`).join('');
  const body = rows.length
    ? rows.map(r=>`<tr>${r.map((c,i)=>`<td style="${reportTdStyle(headers[i]&&headers[i].align)}">${c}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${headers.length}" style="${reportTdStyle()}">${t('no_data')}</td></tr>`;
  return `<div style="font-weight:700;color:#7A1E3A;font-size:15px;margin:14px 0 6px;">${title}</div>
    <table style="${reportTableStyle()}"><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table>`;
}
function buildFullLedgerHtml(){
  let html = reportHeaderHtml('Nidhi Ledger Report', monthLabel(new Date().toISOString().slice(0,7)));
  html += simpleTableHtml('Members', [{label:'Name'},{label:'Phone'},{label:'Join Date'}],
    state.members.map(m=>[m.name, m.phone||'-', m.joinDate||'-']));
  html += simpleTableHtml('Subscriptions', [{label:'Member'},{label:'Month'},{label:'Amount',align:'right'},{label:'Date'}],
    state.subs.map(s=>[memberName(s.memberId), s.month, fmt(s.amount), s.date]));
  html += simpleTableHtml('Loans', [{label:'Loan #'},{label:'Member'},{label:'Principal',align:'right'},{label:'Rate %',align:'right'},{label:'Installments',align:'center'},{label:'Outstanding',align:'right'}],
    state.loans.map((l,i)=>[l.loanNumber||i+1, memberName(l.memberId), fmt(l.amount), l.rate, l.installments, fmt(loanOutstanding(l))]));
  state.loans.forEach((l,i)=>{
    const sched = buildSchedule(l);
    html += simpleTableHtml(`Loan #${l.loanNumber||i+1} Schedule — ${memberName(l.memberId)}`,
      [{label:'Installment'},{label:'Interest %',align:'right'},{label:'Principal',align:'right'},{label:'Interest',align:'right'},{label:'Total',align:'right'},{label:'Status',align:'center'}],
      sched.map(r=>[r.no, r.factor, fmt(r.principalPart), fmt(r.interestPart), fmt(r.total), isInstallmentPaid(l.id,r.no)?t('paid'):t('due')]));
  });
  const paymentRows = (state.loanPayments||[]).map(p=>{
    const loan = state.loans.find(l=>l.id===p.loanId);
    return [loan?memberName(loan.memberId):'-', p.no, fmt(p.amount), p.date];
  });
  html += simpleTableHtml('Loan Payments Received', [{label:'Member'},{label:'Installment'},{label:'Amount Received',align:'right'},{label:'Date'}], paymentRows);
  html += simpleTableHtml('Income / Expense', [{label:'Type'},{label:'Category'},{label:'Amount',align:'right'},{label:'Date'},{label:'Note'}],
    state.transactions.map(x=>[t(x.type), x.category, fmt(x.amount), x.date, x.note||'']));
  return html;
}
async function exportPDF(){
  const canvas = await captureNodeCanvas(buildFullLedgerHtml());
  downloadCanvasPDF(canvas, 'nidhi-ledger-report');
}
async function exportJPEG(){
  const canvas = await captureNodeCanvas(buildFullLedgerHtml());
  downloadCanvasJPEG(canvas, 'nidhi-ledger-report');
}

renderTabs();
loadState();
</script>
